media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif]
    rename: safe

settings:
  content:
    merge: true
  commit:
    identity: app
    templates:
      create: "content: create {path}"
      update: "content: update {path}"
      delete: "content: delete {path}"
      rename: "content: rename {oldPath} -> {newPath}"

content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/content/posts
    format: yaml-frontmatter
    filename:
      template: "{title}.md"
      field: create
    view:
      fields: [title, pubDate, draft]
      primary: title
      sort: [pubDate, title]
      search: [title, description, tags, body]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: pubDate
        label: Publish date
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: draft
        label: Draft
        type: boolean
        default: true
        description: Turn this off when the post is ready to appear on the site and RSS feed.
      - name: tags
        label: Tags
        type: string
        list: true
        required: false
      - name: body
        label: Body
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          path: public/images/blog
          rename: safe
          switcher: true
